import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ultimateglass" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

def generatedPaneResourcesDir = layout.buildDirectory.dir("generated/ultimateGlassPaneResources").get().asFile

sourceSets.main.resources.setSrcDirs([
        generatedPaneResourcesDir,
        file("src/main/resources")
])

tasks.register("generatePaneResources") {
    outputs.dir generatedPaneResourcesDir

    doLast {
        delete generatedPaneResourcesDir

        def writeJson = { String relativePath, Object value ->
            File output = new File(generatedPaneResourcesDir, relativePath)
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + System.lineSeparator()
        }

        def plateBase = [
                render_type: "minecraft:translucent",
                textures: [particle: "#pane"],
                elements: [[
                        from: [0, 0, 0],
                        to: [16, 16, 2],
                        faces: [
                                north: [uv: [0, 0, 16, 16], texture: "#pane"],
                                south: [uv: [0, 0, 16, 16], texture: "#pane"]
                        ]
                ]]
        ]

        def borderBases = [
                top: [
                        render_type: "minecraft:translucent",
                        textures: [particle: "#edge"],
                        elements: [[
                                from: [0, 14, 0],
                                to: [16, 16, 2],
                                faces: [up: [uv: [0, 0, 16, 2], texture: "#edge"]]
                        ]]
                ],
                bottom: [
                        render_type: "minecraft:translucent",
                        textures: [particle: "#edge"],
                        elements: [[
                                from: [0, 0, 0],
                                to: [16, 2, 2],
                                faces: [down: [uv: [0, 0, 16, 2], texture: "#edge"]]
                        ]]
                ],
                left: [
                        render_type: "minecraft:translucent",
                        textures: [particle: "#edge"],
                        elements: [[
                                from: [0, 0, 0],
                                to: [2, 16, 2],
                                faces: [west: [uv: [0, 0, 2, 16], texture: "#edge"]]
                        ]]
                ],
                right: [
                        render_type: "minecraft:translucent",
                        textures: [particle: "#edge"],
                        elements: [[
                                from: [14, 0, 0],
                                to: [16, 16, 2],
                                faces: [east: [uv: [0, 0, 2, 16], texture: "#edge"]]
                        ]]
                ]
        ]

        writeJson(
                "assets/ultimateglass/models/block/edge_pane_plate_base.json",
                plateBase
        )
        borderBases.each { side, model ->
            writeJson(
                    "assets/ultimateglass/models/block/edge_pane_border_${side}_base.json",
                    model
            )
        }

        def colors = [
                [suffix: "", pane: "minecraft:block/glass", edge: "minecraft:block/white_concrete"],
                [suffix: "white", pane: "minecraft:block/white_stained_glass", edge: "minecraft:block/white_concrete"],
                [suffix: "orange", pane: "minecraft:block/orange_stained_glass", edge: "minecraft:block/orange_concrete"],
                [suffix: "magenta", pane: "minecraft:block/magenta_stained_glass", edge: "minecraft:block/magenta_concrete"],
                [suffix: "light_blue", pane: "minecraft:block/light_blue_stained_glass", edge: "minecraft:block/light_blue_concrete"],
                [suffix: "yellow", pane: "minecraft:block/yellow_stained_glass", edge: "minecraft:block/yellow_concrete"],
                [suffix: "lime", pane: "minecraft:block/lime_stained_glass", edge: "minecraft:block/lime_concrete"],
                [suffix: "pink", pane: "minecraft:block/pink_stained_glass", edge: "minecraft:block/pink_concrete"],
                [suffix: "gray", pane: "minecraft:block/gray_stained_glass", edge: "minecraft:block/gray_concrete"],
                [suffix: "light_gray", pane: "minecraft:block/light_gray_stained_glass", edge: "minecraft:block/light_gray_concrete"],
                [suffix: "cyan", pane: "minecraft:block/cyan_stained_glass", edge: "minecraft:block/cyan_concrete"],
                [suffix: "purple", pane: "minecraft:block/purple_stained_glass", edge: "minecraft:block/purple_concrete"],
                [suffix: "blue", pane: "minecraft:block/blue_stained_glass", edge: "minecraft:block/blue_concrete"],
                [suffix: "brown", pane: "minecraft:block/brown_stained_glass", edge: "minecraft:block/brown_concrete"],
                [suffix: "green", pane: "minecraft:block/green_stained_glass", edge: "minecraft:block/green_concrete"],
                [suffix: "red", pane: "minecraft:block/red_stained_glass", edge: "minecraft:block/red_concrete"],
                [suffix: "black", pane: "minecraft:block/black_stained_glass", edge: "minecraft:block/black_concrete"]
        ]

        def orientations = [
                [facing: "north", rotation: [:]],
                [facing: "east", rotation: [y: 90]],
                [facing: "south", rotation: [y: 180]],
                [facing: "west", rotation: [y: 270]],
                [facing: "up", rotation: [x: 270]],
                [facing: "down", rotation: [x: 90]]
        ]

        colors.each { color ->
            String blockName = color.suffix.isEmpty()
                    ? "edge_glass_pane"
                    : "edge_${color.suffix}_stained_glass_pane"
            def textures = [pane: color.pane, edge: color.edge]

            writeJson(
                    "assets/ultimateglass/models/block/${blockName}.json",
                    [parent: "ultimateglass:block/edge_pane_plate_base", textures: textures]
            )

            borderBases.keySet().each { side ->
                writeJson(
                        "assets/ultimateglass/models/block/${blockName}_border_${side}.json",
                        [
                                parent: "ultimateglass:block/edge_pane_border_${side}_base",
                                textures: textures
                        ]
                )
            }

            def multipart = []
            orientations.each { orientation ->
                def plateApply = [model: "ultimateglass:block/${blockName}"] + orientation.rotation
                multipart << [when: [facing: orientation.facing], apply: plateApply]

                borderBases.keySet().each { side ->
                    def borderApply = [
                            model: "ultimateglass:block/${blockName}_border_${side}"
                    ] + orientation.rotation
                    multipart << [
                            when: [
                                    facing: orientation.facing,
                                    ("connect_${side}"): "false"
                            ],
                            apply: borderApply
                    ]
                }
            }

            writeJson(
                    "assets/ultimateglass/blockstates/${blockName}.json",
                    [multipart: multipart]
            )
        }
    }
}

processResources {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
