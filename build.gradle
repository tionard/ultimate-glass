import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ultimateglass" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generatedPaneResourcesDir = layout.buildDirectory.dir("generated/ultimateGlassPaneResources").get().asFile

sourceSets.main.resources.setSrcDirs([
        generatedPaneResourcesDir,
        file("src/main/resources")
])

tasks.register("generatePaneResources") {
    outputs.dir generatedPaneResourcesDir

    doLast {
        delete generatedPaneResourcesDir

        def writeJson = { String relativePath, Object value ->
            File output = new File(generatedPaneResourcesDir, relativePath)
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + System.lineSeparator()
        }

        def directions = [
                north: [axis: 2, minimum: true, opposite: "south"],
                south: [axis: 2, minimum: false, opposite: "north"],
                west : [axis: 0, minimum: true, opposite: "east"],
                east : [axis: 0, minimum: false, opposite: "west"],
                down : [axis: 1, minimum: true, opposite: "up"],
                up   : [axis: 1, minimum: false, opposite: "down"]
        ]
        def connectionSides = ["top", "bottom", "left", "right"]
        def localWingDirections = [
                top: "up",
                bottom: "down",
                left: "west",
                right: "east"
        ]

        def setThinSide = { List<Integer> from, List<Integer> to, String direction ->
            def data = directions[direction]
            if (data.minimum) {
                to[data.axis] = 2
            } else {
                from[data.axis] = 14
            }
        }

        def trimAtSide = { List<Integer> from, List<Integer> to, String direction ->
            def data = directions[direction]
            if (data.minimum) {
                from[data.axis] = 2
            } else {
                to[data.axis] = 14
            }
        }

        def texturedFace = { String texture, boolean dynamicFrame ->
            def face = [texture: texture]
            if (dynamicFrame && texture == "#edge") {
                face.tintindex = 14
            }
            return face
        }

        def allFaces = { String texture, boolean dynamicFrame ->
            def faces = [:]
            directions.keySet().each { direction ->
                faces[direction] = texturedFace(texture, dynamicFrame)
            }
            return faces
        }

        def paneSurfaceElements = { List<Integer> paneFrom, List<Integer> paneTo, String plane, String frameMode ->
            int planeAxis = directions[plane].axis
            def inPlaneAxes = (0..2).findAll { axis -> axis != planeAxis }
            def uvAxes = switch (planeAxis) {
                case 0 -> [2, 1]
                case 1 -> [0, 2]
                default -> [0, 1]
            }
            def cuts = [:]

            inPlaneAxes.each { axis ->
                def axisCuts = [paneFrom[axis]]
                // Vanilla glass textures draw their outside outline in exactly one pixel even
                // though the pane itself is two pixels thick. Keep that outline independently so
                // a horizontal join cannot punch a two-pixel hole in a perpendicular outer edge.
                (frameMode == "none" ? [1, 8, 15] : [1, 2, 8, 14, 15]).each { cut ->
                    if (paneFrom[axis] < cut && cut < paneTo[axis]) {
                        axisCuts << cut
                    }
                }
                axisCuts << paneTo[axis]
                cuts[axis] = axisCuts
            }

            def elements = []
            int firstAxis = inPlaneAxes[0]
            int secondAxis = inPlaneAxes[1]
            for (int first = 0; first < cuts[firstAxis].size() - 1; first++) {
                for (int second = 0; second < cuts[secondAxis].size() - 1; second++) {
                    def from = new ArrayList<Integer>(paneFrom)
                    def to = new ArrayList<Integer>(paneTo)
                    from[firstAxis] = cuts[firstAxis][first]
                    to[firstAxis] = cuts[firstAxis][first + 1]
                    from[secondAxis] = cuts[secondAxis][second]
                    to[secondAxis] = cuts[secondAxis][second + 1]

                    boolean woodBand = frameMode != "none" && inPlaneAxes.any { axis ->
                        (from[axis] == 0 && to[axis] == 1)
                                || (from[axis] == 15 && to[axis] == 16)
                    }
                    String surfaceTexture = woodBand ? "#edge" : "#pane"
                    int normalTintIndex = woodBand && frameMode != "item"
                            ? (frameMode == "dynamic" ? 12 : 13)
                            : -1
                    def normalFaces = [:]
                    normalFaces[plane] = [texture: surfaceTexture]
                    normalFaces[directions[plane].opposite] = [texture: surfaceTexture]
                    if (normalTintIndex >= 0) {
                        normalFaces[plane].tintindex = normalTintIndex
                        normalFaces[directions[plane].opposite].tintindex = normalTintIndex
                    }
                    elements << [from: from, to: to, faces: normalFaces]

                    boolean boundarySection = inPlaneAxes.any { axis ->
                        to[axis] <= 2 || from[axis] >= 14
                    }
                    if (boundarySection && frameMode != "item") {
                        // Preserve the segment's real pixel dimensions while sampling the texture
                        // centre. Stretching the old fixed 2x2 sample over a 1x12 framed strip made
                        // stained-glass joins look like bright, opaque gaps.
                        float uvWidth = to[uvAxes[0]] - from[uvAxes[0]]
                        float uvHeight = to[uvAxes[1]] - from[uvAxes[1]]
                        def seamUv = [
                                8.0F - uvWidth / 2.0F,
                                8.0F - uvHeight / 2.0F,
                                8.0F + uvWidth / 2.0F,
                                8.0F + uvHeight / 2.0F
                        ]
                        // Marker 11 pairs with a one-pixel wood surface; marker 15 is a normal
                        // two-pixel glass/edge replacement. Both are cleared by the client wrapper.
                        int seamTintIndex = woodBand ? 11 : 15
                        def seamlessFaces = [:]
                        seamlessFaces[plane] = [
                                texture: "#pane",
                                uv: seamUv,
                                tintindex: seamTintIndex
                        ]
                        seamlessFaces[directions[plane].opposite] = [
                                texture: "#pane",
                                uv: seamUv,
                                tintindex: seamTintIndex
                        ]
                        elements << [from: from, to: to, faces: seamlessFaces]
                    }
                }
            }
            return elements
        }

        def createMergedShape = { int mask, String frameMode ->
            def planes = ["north"]
            connectionSides.eachWithIndex { side, index ->
                if ((mask & (1 << index)) != 0) {
                    planes << localWingDirections[side]
                }
            }

            def elements = []

            // Transparent panes are trimmed at every shared edge, preventing overlapping glass.
            planes.each { plane ->
                def from = [0, 0, 0]
                def to = [16, 16, 16]
                setThinSide(from, to, plane)

                planes.findAll { other -> other != plane }.each { other ->
                    trimAtSide(from, to, other)
                }

                if ((0..2).every { axis -> to[axis] > from[axis] }) {
                    elements.addAll(paneSurfaceElements(from, to, plane, frameMode))
                }
            }

            // Keep the normal outside frame wherever no perpendicular pane occupies that edge.
            planes.each { plane ->
                def planeData = directions[plane]
                directions.each { edgeDirection, edgeData ->
                    if (edgeData.axis == planeData.axis || planes.contains(edgeDirection)) {
                        return
                    }

                    def from = [0, 0, 0]
                    def to = [16, 16, 16]
                    setThinSide(from, to, plane)
                    setThinSide(from, to, edgeDirection)

                    int lineAxis = -1
                    for (int axis = 0; axis < 3; axis++) {
                        if (axis != planeData.axis && axis != edgeData.axis) {
                            lineAxis = axis
                            break
                        }
                    }

                    planes.findAll { other ->
                        other != plane && directions[other].axis == lineAxis
                    }.each { other ->
                        trimAtSide(from, to, other)
                    }

                    def faces = [:]
                    faces[edgeDirection] = texturedFace("#edge", frameMode == "dynamic")
                    def lineCuts = [from[lineAxis]]
                    if (from[lineAxis] < 8 && 8 < to[lineAxis]) {
                        lineCuts << 8
                    }
                    lineCuts << to[lineAxis]
                    for (int cut = 0; cut < lineCuts.size() - 1; cut++) {
                        def segmentFrom = new ArrayList<Integer>(from)
                        def segmentTo = new ArrayList<Integer>(to)
                        segmentFrom[lineAxis] = lineCuts[cut]
                        segmentTo[lineAxis] = lineCuts[cut + 1]
                        elements << [from: segmentFrom, to: segmentTo, faces: faces]
                    }
                }
            }

            // Each pair of perpendicular panes receives exactly one solid shared frame line.
            for (int firstIndex = 0; firstIndex < planes.size(); firstIndex++) {
                for (int secondIndex = firstIndex + 1; secondIndex < planes.size(); secondIndex++) {
                    String first = planes[firstIndex]
                    String second = planes[secondIndex]
                    int firstAxis = directions[first].axis
                    int secondAxis = directions[second].axis
                    if (firstAxis == secondAxis) {
                        continue
                    }

                    int lineAxis = -1
                    for (int axis = 0; axis < 3; axis++) {
                        if (axis != firstAxis && axis != secondAxis) {
                            lineAxis = axis
                            break
                        }
                    }

                    def from = [0, 0, 0]
                    def to = [16, 16, 16]
                    setThinSide(from, to, first)
                    setThinSide(from, to, second)

                    planes.findAll { third ->
                        third != first && third != second && directions[third].axis == lineAxis
                    }.each { third ->
                        trimAtSide(from, to, third)
                    }

                    if (to[lineAxis] > from[lineAxis]) {
                        def lineCuts = [from[lineAxis]]
                        if (from[lineAxis] < 8 && 8 < to[lineAxis]) {
                            lineCuts << 8
                        }
                        lineCuts << to[lineAxis]
                        for (int cut = 0; cut < lineCuts.size() - 1; cut++) {
                            def segmentFrom = new ArrayList<Integer>(from)
                            def segmentTo = new ArrayList<Integer>(to)
                            segmentFrom[lineAxis] = lineCuts[cut]
                            segmentTo[lineAxis] = lineCuts[cut + 1]
                            elements << [
                                    from: segmentFrom,
                                    to: segmentTo,
                                    faces: allFaces("#edge", frameMode == "dynamic")
                            ]
                        }
                    }
                }
            }

            // Three mutually perpendicular panes meet in one opaque 2x2x2 corner block.
            for (int firstIndex = 0; firstIndex < planes.size(); firstIndex++) {
                for (int secondIndex = firstIndex + 1; secondIndex < planes.size(); secondIndex++) {
                    for (int thirdIndex = secondIndex + 1; thirdIndex < planes.size(); thirdIndex++) {
                        String first = planes[firstIndex]
                        String second = planes[secondIndex]
                        String third = planes[thirdIndex]
                        def axes = [
                                directions[first].axis,
                                directions[second].axis,
                                directions[third].axis
                        ] as Set
                        if (axes.size() != 3) {
                            continue
                        }

                        def from = [0, 0, 0]
                        def to = [16, 16, 16]
                        setThinSide(from, to, first)
                        setThinSide(from, to, second)
                        setThinSide(from, to, third)
                        elements << [
                                from: from,
                                to: to,
                                faces: allFaces("#edge", frameMode == "dynamic")
                        ]
                    }
                }
            }

            return [
                    render_type: "minecraft:translucent",
                    textures: [particle: "#pane"],
                    elements: elements
            ]
        }

        for (int mask = 0; mask < 16; mask++) {
            writeJson(
                    "assets/ultimateglass/models/block/edge_pane_shape_${mask}_base.json",
                    createMergedShape(mask, "none")
            )
            writeJson(
                    "assets/ultimateglass/models/block/edge_pane_shape_${mask}_framed_base.json",
                    createMergedShape(mask, "static")
            )
            writeJson(
                    "assets/ultimateglass/models/block/edge_pane_shape_${mask}_dynamic_framed_base.json",
                    createMergedShape(mask, "dynamic")
            )
        }
        writeJson(
                "assets/ultimateglass/models/block/edge_pane_item_framed_base.json",
                createMergedShape(0, "item")
        )

        def centeredAxes = [
                x: [axis: 0, negative: "west", positive: "east"],
                y: [axis: 1, negative: "down", positive: "up"],
                z: [axis: 2, negative: "north", positive: "south"]
        ]

        def centeredRanges = { boolean split ->
            split ? [[0, 7], [9, 16]] : [[0, 8], [8, 16]]
        }

        def createCenteredShape = { int mask, String frameMode ->
            def active = centeredAxes.findAll { name, data ->
                (mask & (1 << data.axis)) != 0
            }
            def elements = []

            // Each transparent sheet stops at perpendicular center slabs.
            active.each { planeName, planeData ->
                def inPlaneAxes = centeredAxes.findAll { name, data ->
                    data.axis != planeData.axis
                }
                def first = inPlaneAxes.entrySet().toList()[0]
                def second = inPlaneAxes.entrySet().toList()[1]
                centeredRanges(active.containsKey(first.key)).each { firstRange ->
                    centeredRanges(active.containsKey(second.key)).each { secondRange ->
                        def from = [0, 0, 0]
                        def to = [16, 16, 16]
                        from[planeData.axis] = 7
                        to[planeData.axis] = 9
                        from[first.value.axis] = firstRange[0]
                        to[first.value.axis] = firstRange[1]
                        from[second.value.axis] = secondRange[0]
                        to[second.value.axis] = secondRange[1]
                        elements.addAll(paneSurfaceElements(from, to, planeData.negative, frameMode))
                    }
                }
            }

            // Split perimeter frame runs wherever a shared centered line crosses them.
            active.each { planeName, planeData ->
                centeredAxes.findAll { name, data ->
                    data.axis != planeData.axis
                }.each { boundaryName, boundaryData ->
                    def lineEntry = centeredAxes.find { name, data ->
                        data.axis != planeData.axis && data.axis != boundaryData.axis
                    }
                    centeredRanges(active.containsKey(lineEntry.key)).each { lineRange ->
                        [
                                [direction: boundaryData.negative, from: 0, to: 2],
                                [direction: boundaryData.positive, from: 14, to: 16]
                        ].each { boundary ->
                            def from = [0, 0, 0]
                            def to = [16, 16, 16]
                            from[planeData.axis] = 7
                            to[planeData.axis] = 9
                            from[boundaryData.axis] = boundary.from
                            to[boundaryData.axis] = boundary.to
                            from[lineEntry.value.axis] = lineRange[0]
                            to[lineEntry.value.axis] = lineRange[1]
                            elements << [
                                    from: from,
                                    to: to,
                                    faces: [(boundary.direction): texturedFace("#edge", frameMode == "dynamic")]
                            ]
                        }
                    }
                }
            }

            // Exactly one shared opaque line for every pair of centered planes.
            def activeEntries = active.entrySet().toList()
            for (int firstIndex = 0; firstIndex < activeEntries.size(); firstIndex++) {
                for (int secondIndex = firstIndex + 1; secondIndex < activeEntries.size(); secondIndex++) {
                    def first = activeEntries[firstIndex]
                    def second = activeEntries[secondIndex]
                    def lineEntry = centeredAxes.find { name, data ->
                        data.axis != first.value.axis && data.axis != second.value.axis
                    }
                    centeredRanges(active.containsKey(lineEntry.key)).each { lineRange ->
                        def from = [0, 0, 0]
                        def to = [16, 16, 16]
                        from[first.value.axis] = 7
                        to[first.value.axis] = 9
                        from[second.value.axis] = 7
                        to[second.value.axis] = 9
                        from[lineEntry.value.axis] = lineRange[0]
                        to[lineEntry.value.axis] = lineRange[1]
                        elements << [from: from, to: to, faces: allFaces("#edge", frameMode == "dynamic")]
                    }
                }
            }

            if (active.size() == 3) {
                elements << [
                        from: [7, 7, 7],
                        to: [9, 9, 9],
                        faces: allFaces("#edge", frameMode == "dynamic")
                ]
            }

            return [
                    render_type: "minecraft:translucent",
                    textures: [particle: "#pane"],
                    elements: elements
            ]
        }

        for (int mask = 1; mask < 8; mask++) {
            writeJson(
                    "assets/ultimateglass/models/block/centered_pane_shape_${mask}_base.json",
                    createCenteredShape(mask, "none")
            )
            writeJson(
                    "assets/ultimateglass/models/block/centered_pane_shape_${mask}_framed_base.json",
                    createCenteredShape(mask, "static")
            )
            writeJson(
                    "assets/ultimateglass/models/block/centered_pane_shape_${mask}_dynamic_framed_base.json",
                    createCenteredShape(mask, "dynamic")
            )
        }

        def colors = [
                [suffix: "", pane: "minecraft:block/glass", edge: "minecraft:block/white_concrete"],
                [suffix: "white", pane: "minecraft:block/white_stained_glass", edge: "minecraft:block/white_concrete"],
                [suffix: "orange", pane: "minecraft:block/orange_stained_glass", edge: "minecraft:block/orange_concrete"],
                [suffix: "magenta", pane: "minecraft:block/magenta_stained_glass", edge: "minecraft:block/magenta_concrete"],
                [suffix: "light_blue", pane: "minecraft:block/light_blue_stained_glass", edge: "minecraft:block/light_blue_concrete"],
                [suffix: "yellow", pane: "minecraft:block/yellow_stained_glass", edge: "minecraft:block/yellow_concrete"],
                [suffix: "lime", pane: "minecraft:block/lime_stained_glass", edge: "minecraft:block/lime_concrete"],
                [suffix: "pink", pane: "minecraft:block/pink_stained_glass", edge: "minecraft:block/pink_concrete"],
                [suffix: "gray", pane: "minecraft:block/gray_stained_glass", edge: "minecraft:block/gray_concrete"],
                [suffix: "light_gray", pane: "minecraft:block/light_gray_stained_glass", edge: "minecraft:block/light_gray_concrete"],
                [suffix: "cyan", pane: "minecraft:block/cyan_stained_glass", edge: "minecraft:block/cyan_concrete"],
                [suffix: "purple", pane: "minecraft:block/purple_stained_glass", edge: "minecraft:block/purple_concrete"],
                [suffix: "blue", pane: "minecraft:block/blue_stained_glass", edge: "minecraft:block/blue_concrete"],
                [suffix: "brown", pane: "minecraft:block/brown_stained_glass", edge: "minecraft:block/brown_concrete"],
                [suffix: "green", pane: "minecraft:block/green_stained_glass", edge: "minecraft:block/green_concrete"],
                [suffix: "red", pane: "minecraft:block/red_stained_glass", edge: "minecraft:block/red_concrete"],
                [suffix: "black", pane: "minecraft:block/black_stained_glass", edge: "minecraft:block/black_concrete"],
                [suffix: "tinted", pane: "minecraft:block/tinted_glass", edge: "minecraft:block/tinted_glass", tinted: true]
        ]

        def orientations = [
                [facing: "north", rotation: [:]],
                [facing: "east", rotation: [y: 90]],
                [facing: "south", rotation: [y: 180]],
                [facing: "west", rotation: [y: 270]],
                [facing: "up", rotation: [x: 270]],
                [facing: "down", rotation: [x: 90]]
        ]

        def woodFrames = [
                [path: "oak", texture: "minecraft:block/oak_planks"],
                [path: "spruce", texture: "minecraft:block/spruce_planks"],
                [path: "birch", texture: "minecraft:block/birch_planks"],
                [path: "jungle", texture: "minecraft:block/jungle_planks"],
                [path: "acacia", texture: "minecraft:block/acacia_planks"],
                [path: "dark_oak", texture: "minecraft:block/dark_oak_planks"],
                [path: "pale_oak", texture: "minecraft:block/pale_oak_planks"],
                [path: "crimson", texture: "minecraft:block/crimson_planks"],
                [path: "warped", texture: "minecraft:block/warped_planks"],
                [path: "mangrove", texture: "minecraft:block/mangrove_planks"],
                [path: "bamboo", texture: "minecraft:block/bamboo_planks"],
                [path: "cherry", texture: "minecraft:block/cherry_planks"],
                [path: "modded", texture: "minecraft:block/oak_planks", dynamic: true]
        ]

        def framedBlockFaces = [
                north: [normalAxis: 2, positive: false, uAxis: 0, vAxis: 1],
                south: [normalAxis: 2, positive: true,  uAxis: 0, vAxis: 1],
                west : [normalAxis: 0, positive: false, uAxis: 2, vAxis: 1],
                east : [normalAxis: 0, positive: true,  uAxis: 2, vAxis: 1],
                down : [normalAxis: 1, positive: false, uAxis: 0, vAxis: 2],
                up   : [normalAxis: 1, positive: true,  uAxis: 0, vAxis: 2]
        ]

        def createFramedGlassBlockBase = { boolean dynamicFrame ->
            def elements = []
            framedBlockFaces.each { faceName, data ->
                def cuts = [0, 1, 15, 16]
                for (int u = 0; u < cuts.size() - 1; u++) {
                    for (int v = 0; v < cuts.size() - 1; v++) {
                        def from = [0, 0, 0]
                        def to = [16, 16, 16]
                        if (data.positive) {
                            from[data.normalAxis] = 15
                        } else {
                            to[data.normalAxis] = 1
                        }
                        from[data.uAxis] = cuts[u]
                        to[data.uAxis] = cuts[u + 1]
                        from[data.vAxis] = cuts[v]
                        to[data.vAxis] = cuts[v + 1]

                        boolean border = u == 0 || u == cuts.size() - 2
                                || v == 0 || v == cuts.size() - 2
                        def normalFace = [
                                texture: border ? "#edge" : "#pane",
                                cullface: faceName
                        ]
                        if (border) {
                            normalFace.tintindex = dynamicFrame ? 22 : 21
                        }
                        elements << [from: from, to: to, faces: [(faceName): normalFace]]

                        if (border) {
                            elements << [
                                    from: from,
                                    to: to,
                                    faces: [(faceName): [
                                            texture: "#pane",
                                            cullface: faceName,
                                            tintindex: 23
                                    ]]
                            ]
                        }
                    }
                }
            }
            return [
                    render_type: "minecraft:translucent",
                    textures: [particle: "#pane"],
                    elements: elements
            ]
        }

        def createOrdinaryFramedPaneShape = { int mask, boolean dynamicFrame ->
            boolean north = (mask & 1) != 0
            boolean east = (mask & 2) != 0
            boolean south = (mask & 4) != 0
            boolean west = (mask & 8) != 0
            int marker = dynamicFrame ? 14 : 13
            def elements = []

            def addFaceElement = { List<Integer> from, List<Integer> to,
                                   String face, String texture, boolean frame ->
                def faceData = [texture: texture]
                if (frame) {
                    faceData.tintindex = marker
                }
                elements << [from: from, to: to, faces: [(face): faceData]]
            }

            int zMin = north ? 0 : 7
            int zMax = south ? 16 : 9
            def zCuts = ([zMin, 7, 9, zMax] as Set).toList().sort()
            for (int segment = 0; segment < zCuts.size() - 1; segment++) {
                int first = zCuts[segment]
                int last = zCuts[segment + 1]
                boolean central = first >= 7 && last <= 9
                [west: !west || !central, east: !east || !central].each { face, visible ->
                    if (!visible || last <= first) {
                        return
                    }
                    [[0, 1], [1, 15], [15, 16]].each { yRange ->
                        boolean yFrame = yRange[0] == 0 || yRange[1] == 16
                        boolean endFrame = (!north && first == zMin)
                                || (!south && last == zMax)
                        def from = [7, yRange[0], first]
                        def to = [9, yRange[1], last]
                        boolean frame = yFrame || endFrame
                        addFaceElement(from, to, face, frame ? "#edge" : "#pane", frame)
                    }
                }
            }
            [[face: "down", y0: 0, y1: 1], [face: "up", y0: 15, y1: 16]].each { cap ->
                addFaceElement([7, cap.y0, zMin], [9, cap.y1, zMax], cap.face, "#edge", true)
            }
            addFaceElement([7, 0, zMin], [9, 16, zMin + 1], "north",
                    north ? "#pane" : "#edge", !north)
            addFaceElement([7, 0, zMax - 1], [9, 16, zMax], "south",
                    south ? "#pane" : "#edge", !south)

            if (west) {
                [[0, 1], [1, 15], [15, 16]].each { yRange ->
                    boolean frame = yRange[0] == 0 || yRange[1] == 16
                    [north: "north", south: "south"].each { ignored, face ->
                        addFaceElement([0, yRange[0], 7], [7, yRange[1], 9], face,
                                frame ? "#edge" : "#pane", frame)
                    }
                }
                addFaceElement([0, 0, 7], [7, 1, 9], "down", "#edge", true)
                addFaceElement([0, 15, 7], [7, 16, 9], "up", "#edge", true)
                addFaceElement([0, 0, 7], [1, 16, 9], "west", "#pane", false)
            }
            if (east) {
                [[0, 1], [1, 15], [15, 16]].each { yRange ->
                    boolean frame = yRange[0] == 0 || yRange[1] == 16
                    [north: "north", south: "south"].each { ignored, face ->
                        addFaceElement([9, yRange[0], 7], [16, yRange[1], 9], face,
                                frame ? "#edge" : "#pane", frame)
                    }
                }
                addFaceElement([9, 0, 7], [16, 1, 9], "down", "#edge", true)
                addFaceElement([9, 15, 7], [16, 16, 9], "up", "#edge", true)
                addFaceElement([15, 0, 7], [16, 16, 9], "east", "#pane", false)
            }

            return [
                    render_type: "minecraft:translucent",
                    textures: [particle: "#pane"],
                    elements: elements
            ]
        }

        writeJson(
                "assets/ultimateglass/models/block/framed_glass_block_base.json",
                createFramedGlassBlockBase(false)
        )
        writeJson(
                "assets/ultimateglass/models/block/dynamic_framed_glass_block_base.json",
                createFramedGlassBlockBase(true)
        )
        for (int mask = 0; mask < 16; mask++) {
            writeJson(
                    "assets/ultimateglass/models/block/ordinary_framed_pane_shape_${mask}_base.json",
                    createOrdinaryFramedPaneShape(mask, false)
            )
            writeJson(
                    "assets/ultimateglass/models/block/ordinary_dynamic_framed_pane_shape_${mask}_base.json",
                    createOrdinaryFramedPaneShape(mask, true)
            )
        }

        def writeGlassLoot = { String blockName, String itemName, boolean guaranteed ->
            def pool = [
                    entries: [[type: "minecraft:item", name: "ultimateglass:${itemName}"]],
                    rolls: 1.0
            ]
            if (!guaranteed) {
                pool.conditions = [[
                        condition: "minecraft:match_tool",
                        predicate: [predicates: [
                                "minecraft:enchantments": [[
                                        enchantments: "minecraft:silk_touch",
                                        levels: [min: 1]
                                ]]
                        ]]
                ]]
            }
            writeJson(
                    "data/ultimateglass/loot_table/blocks/${blockName}.json",
                    [
                            type: "minecraft:block",
                            pools: [pool],
                            random_sequence: "ultimateglass:blocks/${blockName}"
                    ]
            )
        }

        colors.each { color ->
            boolean tinted = color.tinted ?: false
            String blockName = tinted
                    ? "edge_tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "edge_glass_pane"
                    : "edge_${color.suffix}_stained_glass_pane"
            String centeredBlockName = tinted
                    ? "centered_tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "centered_glass_pane"
                    : "centered_${color.suffix}_stained_glass_pane"
            String vanillaPaneName = tinted
                    ? "tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "glass_pane"
                    : "${color.suffix}_stained_glass_pane"
            String vanillaBlockName = tinted
                    ? "tinted_glass"
                    : color.suffix.isEmpty()
                    ? "glass"
                    : "${color.suffix}_stained_glass"
            String customItemName = "ultimate_${vanillaPaneName}"
            String temperedBlockName = "ultimate_${vanillaBlockName}"
            def textures = [pane: color.pane, edge: color.edge]

            writeJson(
                    "assets/ultimateglass/models/block/${temperedBlockName}.json",
                    [
                            parent: "minecraft:block/cube_all",
                            render_type: "minecraft:translucent",
                            textures: [all: color.pane, particle: color.pane]
                    ]
            )
            writeJson(
                    "assets/ultimateglass/blockstates/${temperedBlockName}.json",
                    [variants: ["": [model: "ultimateglass:block/${temperedBlockName}"]]]
            )
            writeJson(
                    "assets/ultimateglass/models/item/${temperedBlockName}.json",
                    [parent: "ultimateglass:block/${temperedBlockName}"]
            )
            writeJson(
                    "assets/ultimateglass/items/${temperedBlockName}.json",
                    [model: [type: "minecraft:model", model: "ultimateglass:item/${temperedBlockName}"]]
            )
            writeJson(
                    "data/ultimateglass/recipe/${temperedBlockName}.json",
                    [
                            type: "minecraft:smelting",
                            category: "blocks",
                            group: "tempered_glass_blocks",
                            ingredient: "minecraft:${vanillaBlockName}",
                            result: [
                                    id: "ultimateglass:tempered_glass",
                                    components: [
                                            "ultimateglass:glass_material": "minecraft:${vanillaBlockName}"
                                    ]
                            ],
                            experience: 0.1,
                            cookingtime: 200
                    ]
            )
            writeJson(
                    "data/ultimateglass/recipe/${temperedBlockName}_from_blasting.json",
                    [
                            type: "minecraft:blasting",
                            category: "blocks",
                            group: "tempered_glass_blocks",
                            ingredient: "minecraft:${vanillaBlockName}",
                            result: [
                                    id: "ultimateglass:tempered_glass",
                                    components: [
                                            "ultimateglass:glass_material": "minecraft:${vanillaBlockName}"
                                    ]
                            ],
                            experience: 0.1,
                            cookingtime: 100
                    ]
            )
            writeGlassLoot(temperedBlockName, temperedBlockName, tinted)

            writeJson(
                    "assets/ultimateglass/models/item/${customItemName}.json",
                    [
                            parent: "minecraft:item/generated",
                            textures: [layer0: color.pane]
                    ]
            )

            writeJson(
                    "assets/ultimateglass/items/${customItemName}.json",
                    [
                            model: [
                                    type: "minecraft:model",
                                    model: "ultimateglass:item/${customItemName}"
                            ]
                    ]
            )

            String cookingInput = tinted
                    ? "ultimateglass:tinted_glass_pane"
                    : "minecraft:${vanillaPaneName}"
            if (tinted) {
                writeJson(
                        "data/ultimateglass/recipe/tinted_glass_pane.json",
                        [
                                type: "minecraft:crafting_shaped",
                                category: "building",
                                group: "vanilla_glass_panes",
                                pattern: ["###", "###"],
                                key: ["#": "minecraft:tinted_glass"],
                                result: [id: "ultimateglass:tinted_glass_pane", count: 16]
                        ]
                )
            }

            writeJson(
                    "data/ultimateglass/recipe/${customItemName}.json",
                    [
                            type: "minecraft:smelting",
                            category: "blocks",
                            group: "tempered_glass_panes",
                            ingredient: cookingInput,
                            result: [
                                    id: "ultimateglass:tempered_glass_pane",
                                    components: [
                                            "ultimateglass:glass_material": "minecraft:${vanillaBlockName}"
                                    ]
                            ],
                            experience: 0.1,
                            cookingtime: 200
                    ]
            )
            writeJson(
                    "data/ultimateglass/recipe/${customItemName}_from_blasting.json",
                    [
                            type: "minecraft:blasting",
                            category: "blocks",
                            group: "tempered_glass_panes",
                            ingredient: cookingInput,
                            result: [
                                    id: "ultimateglass:tempered_glass_pane",
                                    components: [
                                            "ultimateglass:glass_material": "minecraft:${vanillaBlockName}"
                                    ]
                            ],
                            experience: 0.1,
                            cookingtime: 100
                    ]
            )

            [blockName, centeredBlockName].each { customBlockName ->
                writeJson(
                        "data/ultimateglass/loot_table/blocks/${customBlockName}.json",
                        [
                                type: "minecraft:block",
                                pools: [[
                                        conditions: [[
                                                condition: "minecraft:match_tool",
                                                predicate: [
                                                        predicates: [
                                                                "minecraft:enchantments": [[
                                                                        enchantments: "minecraft:silk_touch",
                                                                        levels: [min: 1]
                                                                ]]
                                                        ]
                                                ]
                                        ]],
                                        entries: [[
                                                type: "minecraft:item",
                                                name: "ultimateglass:${customItemName}"
                                        ]],
                                        rolls: 1.0
                                ]],
                                random_sequence: "ultimateglass:blocks/${customBlockName}"
                        ]
                )
            }

            for (int mask = 1; mask < 8; mask++) {
                writeJson(
                        "assets/ultimateglass/models/block/${centeredBlockName}_shape_${mask}.json",
                        [
                                parent: "ultimateglass:block/centered_pane_shape_${mask}_base",
                                textures: textures
                        ]
                )
            }

            def centeredVariants = [:]
            centeredAxes.each { primaryName, primaryData ->
                def perpendicular = centeredAxes.findAll { name, data ->
                    data.axis != primaryData.axis
                }.entrySet().toList().sort { entry -> entry.value.axis }
                for (int connectionMask = 0; connectionMask < 4; connectionMask++) {
                    int shapeMask = 1 << primaryData.axis
                    if ((connectionMask & 1) != 0) {
                        shapeMask |= 1 << perpendicular[0].value.axis
                    }
                    if ((connectionMask & 2) != 0) {
                        shapeMask |= 1 << perpendicular[1].value.axis
                    }
                    String key = "axis=${primaryName},connect_first=${(connectionMask & 1) != 0},connect_second=${(connectionMask & 2) != 0}"
                    centeredVariants[key] = [
                            model: "ultimateglass:block/${centeredBlockName}_shape_${shapeMask}"
                    ]
                }
            }

            writeJson(
                    "assets/ultimateglass/blockstates/${centeredBlockName}.json",
                    [variants: centeredVariants]
            )

            for (int mask = 0; mask < 16; mask++) {
                writeJson(
                        "assets/ultimateglass/models/block/${blockName}_shape_${mask}.json",
                        [
                                parent: "ultimateglass:block/edge_pane_shape_${mask}_base",
                                textures: textures
                        ]
                )
            }

            def multipart = []
            orientations.each { orientation ->
                for (int mask = 0; mask < 16; mask++) {
                    def condition = [facing: orientation.facing]
                    connectionSides.eachWithIndex { side, index ->
                        condition["connect_${side}"] = ((mask & (1 << index)) != 0).toString()
                    }

                    multipart << [
                            when: condition,
                            apply: [
                                    model: "ultimateglass:block/${blockName}_shape_${mask}"
                            ] + orientation.rotation
                    ]
                }
            }

            writeJson(
                    "assets/ultimateglass/blockstates/${blockName}.json",
                    [multipart: multipart]
            )

            woodFrames.each { wood ->
                boolean dynamicFrame = wood.dynamic ?: false
                String framePrefix = dynamicFrame ? "modded_framed_" : "${wood.path}_framed_"
                String frameBlockName = "edge_${framePrefix}${vanillaPaneName}"
                String frameCenteredBlockName = "centered_${framePrefix}${vanillaPaneName}"
                String frameItemName = dynamicFrame
                        ? "modded_framed_ultimate_${vanillaPaneName}"
                        : "${wood.path}_framed_ultimate_${vanillaPaneName}"
                String shapeSuffix = dynamicFrame ? "dynamic_framed" : "framed"
                def frameTextures = [pane: color.pane, edge: wood.texture]

                writeJson(
                        "assets/ultimateglass/models/item/${frameItemName}.json",
                        [
                                parent: "ultimateglass:block/edge_pane_item_framed_base",
                                textures: frameTextures
                        ]
                )
                writeJson(
                        "assets/ultimateglass/items/${frameItemName}.json",
                        [model: [type: "minecraft:model", model: "ultimateglass:item/${frameItemName}"]]
                )

                [frameBlockName, frameCenteredBlockName].each { customBlockName ->
                    writeJson(
                            "data/ultimateglass/loot_table/blocks/${customBlockName}.json",
                            [
                                    type: "minecraft:block",
                                    pools: [[
                                            conditions: [[
                                                    condition: "minecraft:match_tool",
                                                    predicate: [predicates: [
                                                            "minecraft:enchantments": [[
                                                                    enchantments: "minecraft:silk_touch",
                                                                    levels: [min: 1]
                                                            ]]
                                                    ]]
                                            ]],
                                            entries: [[type: "minecraft:item", name: "ultimateglass:${frameItemName}"]],
                                            rolls: 1.0
                                    ]],
                                    random_sequence: "ultimateglass:blocks/${customBlockName}"
                            ]
                    )
                }

                for (int mask = 1; mask < 8; mask++) {
                    writeJson(
                            "assets/ultimateglass/models/block/${frameCenteredBlockName}_shape_${mask}.json",
                            [
                                    parent: "ultimateglass:block/centered_pane_shape_${mask}_${shapeSuffix}_base",
                                    textures: frameTextures
                            ]
                    )
                }

                def frameCenteredVariants = [:]
                centeredAxes.each { primaryName, primaryData ->
                    def perpendicular = centeredAxes.findAll { name, data ->
                        data.axis != primaryData.axis
                    }.entrySet().toList().sort { entry -> entry.value.axis }
                    for (int connectionMask = 0; connectionMask < 4; connectionMask++) {
                        int shapeMask = 1 << primaryData.axis
                        if ((connectionMask & 1) != 0) {
                            shapeMask |= 1 << perpendicular[0].value.axis
                        }
                        if ((connectionMask & 2) != 0) {
                            shapeMask |= 1 << perpendicular[1].value.axis
                        }
                        String key = "axis=${primaryName},connect_first=${(connectionMask & 1) != 0},connect_second=${(connectionMask & 2) != 0}"
                        frameCenteredVariants[key] = [
                                model: "ultimateglass:block/${frameCenteredBlockName}_shape_${shapeMask}"
                        ]
                    }
                }
                writeJson(
                        "assets/ultimateglass/blockstates/${frameCenteredBlockName}.json",
                        [variants: frameCenteredVariants]
                )

                for (int mask = 0; mask < 16; mask++) {
                    writeJson(
                            "assets/ultimateglass/models/block/${frameBlockName}_shape_${mask}.json",
                            [
                                    parent: "ultimateglass:block/edge_pane_shape_${mask}_${shapeSuffix}_base",
                                    textures: frameTextures
                            ]
                    )
                }

                def frameMultipart = []
                orientations.each { orientation ->
                    for (int mask = 0; mask < 16; mask++) {
                        def condition = [facing: orientation.facing]
                        connectionSides.eachWithIndex { side, index ->
                            condition["connect_${side}"] = ((mask & (1 << index)) != 0).toString()
                        }
                        frameMultipart << [
                                when: condition,
                                apply: [model: "ultimateglass:block/${frameBlockName}_shape_${mask}"]
                                        + orientation.rotation
                        ]
                    }
                }
                writeJson(
                        "assets/ultimateglass/blockstates/${frameBlockName}.json",
                        [multipart: frameMultipart]
                )

                String ordinaryPaneName = "${framePrefix}${vanillaPaneName}"
                String ordinaryBlockName = "${framePrefix}${vanillaBlockName}"
                String temperedFramedBlockName = "${framePrefix}ultimate_${vanillaBlockName}"
                String ordinaryPaneBase = dynamicFrame
                        ? "ordinary_dynamic_framed_pane"
                        : "ordinary_framed_pane"
                String framedBlockBase = dynamicFrame
                        ? "dynamic_framed_glass_block_base"
                        : "framed_glass_block_base"

                writeJson(
                        "assets/ultimateglass/models/item/${ordinaryPaneName}.json",
                        [
                                parent: "ultimateglass:block/edge_pane_item_framed_base",
                                textures: frameTextures
                        ]
                )
                writeJson(
                        "assets/ultimateglass/items/${ordinaryPaneName}.json",
                        [model: [type: "minecraft:model", model: "ultimateglass:item/${ordinaryPaneName}"]]
                )
                for (int mask = 0; mask < 16; mask++) {
                    writeJson(
                            "assets/ultimateglass/models/block/${ordinaryPaneName}_shape_${mask}.json",
                            [
                                    parent: "ultimateglass:block/${ordinaryPaneBase}_shape_${mask}_base",
                                    textures: frameTextures
                            ]
                    )
                }
                def ordinaryPaneMultipart = []
                for (int mask = 0; mask < 16; mask++) {
                    def condition = [:]
                    ["north", "east", "south", "west"].eachWithIndex { side, index ->
                        condition[side] = ((mask & (1 << index)) != 0).toString()
                    }
                    ordinaryPaneMultipart << [
                            when: condition,
                            apply: [model: "ultimateglass:block/${ordinaryPaneName}_shape_${mask}"]
                    ]
                }
                writeJson(
                        "assets/ultimateglass/blockstates/${ordinaryPaneName}.json",
                        [multipart: ordinaryPaneMultipart]
                )
                writeGlassLoot(ordinaryPaneName, ordinaryPaneName, tinted)

                [
                        [name: ordinaryBlockName, tempered: false],
                        [name: temperedFramedBlockName, tempered: true]
                ].each { framedFullBlock ->
                    writeJson(
                            "assets/ultimateglass/models/block/${framedFullBlock.name}.json",
                            [
                                    parent: "ultimateglass:block/${framedBlockBase}",
                                    textures: frameTextures
                            ]
                    )
                    writeJson(
                            "assets/ultimateglass/blockstates/${framedFullBlock.name}.json",
                            [variants: ["": [model: "ultimateglass:block/${framedFullBlock.name}"]]]
                    )
                    writeJson(
                            "assets/ultimateglass/models/item/${framedFullBlock.name}.json",
                            [parent: "ultimateglass:block/${framedFullBlock.name}"]
                    )
                    writeJson(
                            "assets/ultimateglass/items/${framedFullBlock.name}.json",
                            [model: [
                                    type: "minecraft:model",
                                    model: "ultimateglass:item/${framedFullBlock.name}"
                            ]]
                    )
                    writeGlassLoot(
                            framedFullBlock.name,
                            framedFullBlock.name,
                            tinted
                    )
                }
            }
        }

        writeJson(
                "data/ultimateglass/recipe/wood_framed_pane.json",
                [type: "ultimateglass:wood_framed_pane"]
        )

        def tintedPaneModels = [
                post: "template_glass_pane_post",
                side: "template_glass_pane_side",
                side_alt: "template_glass_pane_side_alt",
                noside: "template_glass_pane_noside",
                noside_alt: "template_glass_pane_noside_alt"
        ]
        tintedPaneModels.each { name, parent ->
            def textures = [pane: "minecraft:block/tinted_glass"]
            if (!name.startsWith("noside")) {
                textures.edge = "minecraft:block/tinted_glass"
            }
            writeJson(
                    "assets/ultimateglass/models/block/tinted_glass_pane_${name}.json",
                    [parent: "minecraft:block/${parent}", textures: textures]
            )
        }
        writeJson(
                "assets/ultimateglass/blockstates/tinted_glass_pane.json",
                [multipart: [
                        [apply: [model: "ultimateglass:block/tinted_glass_pane_post"]],
                        [when: [north: "true"], apply: [model: "ultimateglass:block/tinted_glass_pane_side"]],
                        [when: [east: "true"], apply: [model: "ultimateglass:block/tinted_glass_pane_side", y: 90]],
                        [when: [south: "true"], apply: [model: "ultimateglass:block/tinted_glass_pane_side_alt"]],
                        [when: [west: "true"], apply: [model: "ultimateglass:block/tinted_glass_pane_side_alt", y: 90]],
                        [when: [north: "false"], apply: [model: "ultimateglass:block/tinted_glass_pane_noside"]],
                        [when: [east: "false"], apply: [model: "ultimateglass:block/tinted_glass_pane_noside_alt"]],
                        [when: [south: "false"], apply: [model: "ultimateglass:block/tinted_glass_pane_noside_alt", y: 90]],
                        [when: [west: "false"], apply: [model: "ultimateglass:block/tinted_glass_pane_noside", y: 270]]
                ]]
        )
        writeJson(
                "assets/ultimateglass/models/item/tinted_glass_pane.json",
                [parent: "minecraft:item/generated", textures: [layer0: "minecraft:block/tinted_glass"]]
        )
        writeJson(
                "assets/ultimateglass/items/tinted_glass_pane.json",
                [model: [type: "minecraft:model", model: "ultimateglass:item/tinted_glass_pane"]]
        )
        writeJson(
                "data/ultimateglass/loot_table/blocks/tinted_glass_pane.json",
                [
                        type: "minecraft:block",
                        pools: [[
                                conditions: [[
                                        condition: "minecraft:match_tool",
                                        predicate: [predicates: [
                                                "minecraft:enchantments": [[
                                                        enchantments: "minecraft:silk_touch",
                                                        levels: [min: 1]
                                                ]]
                                        ]]
                                ]],
                                entries: [[type: "minecraft:item", name: "ultimateglass:tinted_glass_pane"]],
                                rolls: 1.0
                        ]],
                        random_sequence: "ultimateglass:blocks/tinted_glass_pane"
                ]
        )
    }
}

processResources {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
