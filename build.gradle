import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ultimateglass" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generatedPaneResourcesDir = layout.buildDirectory.dir("generated/ultimateGlassPaneResources").get().asFile

sourceSets.main.resources.setSrcDirs([
        generatedPaneResourcesDir,
        file("src/main/resources")
])

tasks.register("generatePaneResources") {
    outputs.dir generatedPaneResourcesDir

    doLast {
        delete generatedPaneResourcesDir

        def writeJson = { String relativePath, Object value ->
            File output = new File(generatedPaneResourcesDir, relativePath)
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + System.lineSeparator()
        }

        def directions = [
                north: [axis: 2, minimum: true, opposite: "south"],
                south: [axis: 2, minimum: false, opposite: "north"],
                west : [axis: 0, minimum: true, opposite: "east"],
                east : [axis: 0, minimum: false, opposite: "west"],
                down : [axis: 1, minimum: true, opposite: "up"],
                up   : [axis: 1, minimum: false, opposite: "down"]
        ]
        def connectionSides = ["top", "bottom", "left", "right"]
        def localWingDirections = [
                top: "up",
                bottom: "down",
                left: "west",
                right: "east"
        ]

        def setThinSide = { List<Integer> from, List<Integer> to, String direction ->
            def data = directions[direction]
            if (data.minimum) {
                to[data.axis] = 2
            } else {
                from[data.axis] = 14
            }
        }

        def trimAtSide = { List<Integer> from, List<Integer> to, String direction ->
            def data = directions[direction]
            if (data.minimum) {
                from[data.axis] = 2
            } else {
                to[data.axis] = 14
            }
        }

        def allFaces = { String texture ->
            def faces = [:]
            directions.keySet().each { direction ->
                faces[direction] = [texture: texture]
            }
            return faces
        }

        def paneSurfaceElements = { List<Integer> paneFrom, List<Integer> paneTo, String plane ->
            int planeAxis = directions[plane].axis
            def inPlaneAxes = (0..2).findAll { axis -> axis != planeAxis }
            def cuts = [:]

            inPlaneAxes.each { axis ->
                def axisCuts = [paneFrom[axis]]
                [2, 14].each { cut ->
                    if (paneFrom[axis] < cut && cut < paneTo[axis]) {
                        axisCuts << cut
                    }
                }
                axisCuts << paneTo[axis]
                cuts[axis] = axisCuts
            }

            def elements = []
            int firstAxis = inPlaneAxes[0]
            int secondAxis = inPlaneAxes[1]
            for (int first = 0; first < cuts[firstAxis].size() - 1; first++) {
                for (int second = 0; second < cuts[secondAxis].size() - 1; second++) {
                    def from = new ArrayList<Integer>(paneFrom)
                    def to = new ArrayList<Integer>(paneTo)
                    from[firstAxis] = cuts[firstAxis][first]
                    to[firstAxis] = cuts[firstAxis][first + 1]
                    from[secondAxis] = cuts[secondAxis][second]
                    to[secondAxis] = cuts[secondAxis][second + 1]

                    def normalFaces = [:]
                    normalFaces[plane] = [texture: "#pane"]
                    normalFaces[directions[plane].opposite] = [texture: "#pane"]
                    elements << [from: from, to: to, faces: normalFaces]

                    boolean boundarySection = inPlaneAxes.any { axis ->
                        (from[axis] == 0 && to[axis] <= 2)
                                || (from[axis] >= 14 && to[axis] == 16)
                    }
                    if (boundarySection) {
                        // Sample a real 2x2 region at the pane texture's centre. Tint index 15 is
                        // metadata for the runtime wrapper and is cleared before the quad emits.
                        def seamlessFaces = [:]
                        seamlessFaces[plane] = [
                                texture: "#pane",
                                uv: [7, 7, 9, 9],
                                tintindex: 15
                        ]
                        seamlessFaces[directions[plane].opposite] = [
                                texture: "#pane",
                                uv: [7, 7, 9, 9],
                                tintindex: 15
                        ]
                        elements << [from: from, to: to, faces: seamlessFaces]
                    }
                }
            }
            return elements
        }

        def createMergedShape = { int mask ->
            def planes = ["north"]
            connectionSides.eachWithIndex { side, index ->
                if ((mask & (1 << index)) != 0) {
                    planes << localWingDirections[side]
                }
            }

            def elements = []

            // Transparent panes are trimmed at every shared edge, preventing overlapping glass.
            planes.each { plane ->
                def from = [0, 0, 0]
                def to = [16, 16, 16]
                setThinSide(from, to, plane)

                planes.findAll { other -> other != plane }.each { other ->
                    trimAtSide(from, to, other)
                }

                if ((0..2).every { axis -> to[axis] > from[axis] }) {
                    elements.addAll(paneSurfaceElements(from, to, plane))
                }
            }

            // Keep the normal outside frame wherever no perpendicular pane occupies that edge.
            planes.each { plane ->
                def planeData = directions[plane]
                directions.each { edgeDirection, edgeData ->
                    if (edgeData.axis == planeData.axis || planes.contains(edgeDirection)) {
                        return
                    }

                    def from = [0, 0, 0]
                    def to = [16, 16, 16]
                    setThinSide(from, to, plane)
                    setThinSide(from, to, edgeDirection)

                    int lineAxis = -1
                    for (int axis = 0; axis < 3; axis++) {
                        if (axis != planeData.axis && axis != edgeData.axis) {
                            lineAxis = axis
                            break
                        }
                    }

                    planes.findAll { other ->
                        other != plane && directions[other].axis == lineAxis
                    }.each { other ->
                        trimAtSide(from, to, other)
                    }

                    def faces = [:]
                    faces[edgeDirection] = [texture: "#edge"]
                    elements << [from: from, to: to, faces: faces]
                }
            }

            // Each pair of perpendicular panes receives exactly one solid shared frame line.
            for (int firstIndex = 0; firstIndex < planes.size(); firstIndex++) {
                for (int secondIndex = firstIndex + 1; secondIndex < planes.size(); secondIndex++) {
                    String first = planes[firstIndex]
                    String second = planes[secondIndex]
                    int firstAxis = directions[first].axis
                    int secondAxis = directions[second].axis
                    if (firstAxis == secondAxis) {
                        continue
                    }

                    int lineAxis = -1
                    for (int axis = 0; axis < 3; axis++) {
                        if (axis != firstAxis && axis != secondAxis) {
                            lineAxis = axis
                            break
                        }
                    }

                    def from = [0, 0, 0]
                    def to = [16, 16, 16]
                    setThinSide(from, to, first)
                    setThinSide(from, to, second)

                    planes.findAll { third ->
                        third != first && third != second && directions[third].axis == lineAxis
                    }.each { third ->
                        trimAtSide(from, to, third)
                    }

                    if (to[lineAxis] > from[lineAxis]) {
                        elements << [
                                from: from,
                                to: to,
                                faces: allFaces("#edge")
                        ]
                    }
                }
            }

            // Three mutually perpendicular panes meet in one opaque 2x2x2 corner block.
            for (int firstIndex = 0; firstIndex < planes.size(); firstIndex++) {
                for (int secondIndex = firstIndex + 1; secondIndex < planes.size(); secondIndex++) {
                    for (int thirdIndex = secondIndex + 1; thirdIndex < planes.size(); thirdIndex++) {
                        String first = planes[firstIndex]
                        String second = planes[secondIndex]
                        String third = planes[thirdIndex]
                        def axes = [
                                directions[first].axis,
                                directions[second].axis,
                                directions[third].axis
                        ] as Set
                        if (axes.size() != 3) {
                            continue
                        }

                        def from = [0, 0, 0]
                        def to = [16, 16, 16]
                        setThinSide(from, to, first)
                        setThinSide(from, to, second)
                        setThinSide(from, to, third)
                        elements << [
                                from: from,
                                to: to,
                                faces: allFaces("#edge")
                        ]
                    }
                }
            }

            return [
                    render_type: "minecraft:translucent",
                    textures: [particle: "#pane"],
                    elements: elements
            ]
        }

        for (int mask = 0; mask < 16; mask++) {
            writeJson(
                    "assets/ultimateglass/models/block/edge_pane_shape_${mask}_base.json",
                    createMergedShape(mask)
            )
        }

        def centeredElements = paneSurfaceElements([0, 0, 7], [16, 16, 9], "north")
        centeredElements.addAll([
                [from: [0, 0, 7], to: [2, 16, 9], faces: [west: [texture: "#edge"]]],
                [from: [14, 0, 7], to: [16, 16, 9], faces: [east: [texture: "#edge"]]],
                [from: [0, 0, 7], to: [16, 2, 9], faces: [down: [texture: "#edge"]]],
                [from: [0, 14, 7], to: [16, 16, 9], faces: [up: [texture: "#edge"]]]
        ])
        writeJson(
                "assets/ultimateglass/models/block/centered_pane_base.json",
                [
                        render_type: "minecraft:translucent",
                        textures: [particle: "#pane"],
                        elements: centeredElements
                ]
        )

        def colors = [
                [suffix: "", pane: "minecraft:block/glass", edge: "minecraft:block/white_concrete"],
                [suffix: "white", pane: "minecraft:block/white_stained_glass", edge: "minecraft:block/white_concrete"],
                [suffix: "orange", pane: "minecraft:block/orange_stained_glass", edge: "minecraft:block/orange_concrete"],
                [suffix: "magenta", pane: "minecraft:block/magenta_stained_glass", edge: "minecraft:block/magenta_concrete"],
                [suffix: "light_blue", pane: "minecraft:block/light_blue_stained_glass", edge: "minecraft:block/light_blue_concrete"],
                [suffix: "yellow", pane: "minecraft:block/yellow_stained_glass", edge: "minecraft:block/yellow_concrete"],
                [suffix: "lime", pane: "minecraft:block/lime_stained_glass", edge: "minecraft:block/lime_concrete"],
                [suffix: "pink", pane: "minecraft:block/pink_stained_glass", edge: "minecraft:block/pink_concrete"],
                [suffix: "gray", pane: "minecraft:block/gray_stained_glass", edge: "minecraft:block/gray_concrete"],
                [suffix: "light_gray", pane: "minecraft:block/light_gray_stained_glass", edge: "minecraft:block/light_gray_concrete"],
                [suffix: "cyan", pane: "minecraft:block/cyan_stained_glass", edge: "minecraft:block/cyan_concrete"],
                [suffix: "purple", pane: "minecraft:block/purple_stained_glass", edge: "minecraft:block/purple_concrete"],
                [suffix: "blue", pane: "minecraft:block/blue_stained_glass", edge: "minecraft:block/blue_concrete"],
                [suffix: "brown", pane: "minecraft:block/brown_stained_glass", edge: "minecraft:block/brown_concrete"],
                [suffix: "green", pane: "minecraft:block/green_stained_glass", edge: "minecraft:block/green_concrete"],
                [suffix: "red", pane: "minecraft:block/red_stained_glass", edge: "minecraft:block/red_concrete"],
                [suffix: "black", pane: "minecraft:block/black_stained_glass", edge: "minecraft:block/black_concrete"],
                [suffix: "tinted", pane: "minecraft:block/tinted_glass", edge: "minecraft:block/tinted_glass", tinted: true]
        ]

        def orientations = [
                [facing: "north", rotation: [:]],
                [facing: "east", rotation: [y: 90]],
                [facing: "south", rotation: [y: 180]],
                [facing: "west", rotation: [y: 270]],
                [facing: "up", rotation: [x: 270]],
                [facing: "down", rotation: [x: 90]]
        ]

        colors.each { color ->
            boolean tinted = color.tinted ?: false
            String blockName = tinted
                    ? "edge_tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "edge_glass_pane"
                    : "edge_${color.suffix}_stained_glass_pane"
            String centeredBlockName = tinted
                    ? "centered_tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "centered_glass_pane"
                    : "centered_${color.suffix}_stained_glass_pane"
            String vanillaPaneName = tinted
                    ? "tinted_glass_pane"
                    : color.suffix.isEmpty()
                    ? "glass_pane"
                    : "${color.suffix}_stained_glass_pane"
            String customItemName = "ultimate_${vanillaPaneName}"
            def textures = [pane: color.pane, edge: color.edge]

            writeJson(
                    "assets/ultimateglass/models/item/${customItemName}.json",
                    [
                            parent: "minecraft:item/generated",
                            textures: [layer0: color.pane]
                    ]
            )

            writeJson(
                    "assets/ultimateglass/items/${customItemName}.json",
                    [
                            model: [
                                    type: "minecraft:model",
                                    model: "ultimateglass:item/${customItemName}"
                            ]
                    ]
            )

            if (tinted) {
                writeJson(
                        "data/ultimateglass/recipe/${customItemName}.json",
                        [
                                type: "minecraft:crafting_shaped",
                                category: "building",
                                group: "ultimate_glass_panes",
                                pattern: ["###", "###"],
                                key: ["#": "minecraft:tinted_glass"],
                                result: [id: "ultimateglass:${customItemName}", count: 16]
                        ]
                )
            } else {
                writeJson(
                        "data/ultimateglass/recipe/${customItemName}.json",
                        [
                                type: "minecraft:crafting_shapeless",
                                category: "building",
                                group: "ultimate_glass_panes",
                                ingredients: ["minecraft:${vanillaPaneName}"],
                                result: [id: "ultimateglass:${customItemName}"]
                        ]
                )

                writeJson(
                        "data/ultimateglass/recipe/${vanillaPaneName}_from_${customItemName}.json",
                        [
                                type: "minecraft:crafting_shapeless",
                                category: "building",
                                group: "vanilla_glass_panes",
                                ingredients: ["ultimateglass:${customItemName}"],
                                result: [id: "minecraft:${vanillaPaneName}"]
                        ]
                )
            }

            [blockName, centeredBlockName].each { customBlockName ->
                writeJson(
                        "data/ultimateglass/loot_table/blocks/${customBlockName}.json",
                        [
                                type: "minecraft:block",
                                pools: [[
                                        conditions: [[
                                                condition: "minecraft:match_tool",
                                                predicate: [
                                                        predicates: [
                                                                "minecraft:enchantments": [[
                                                                        enchantments: "minecraft:silk_touch",
                                                                        levels: [min: 1]
                                                                ]]
                                                        ]
                                                ]
                                        ]],
                                        entries: [[
                                                type: "minecraft:item",
                                                name: "ultimateglass:${customItemName}"
                                        ]],
                                        rolls: 1.0
                                ]],
                                random_sequence: "ultimateglass:blocks/${customBlockName}"
                        ]
                )
            }

            writeJson(
                    "assets/ultimateglass/models/block/${centeredBlockName}.json",
                    [
                            parent: "ultimateglass:block/centered_pane_base",
                            textures: textures
                    ]
            )

            writeJson(
                    "assets/ultimateglass/blockstates/${centeredBlockName}.json",
                    [
                            variants: [
                                    "axis=x": [
                                            model: "ultimateglass:block/${centeredBlockName}",
                                            y: 90
                                    ],
                                    "axis=y": [
                                            model: "ultimateglass:block/${centeredBlockName}",
                                            x: 90
                                    ],
                                    "axis=z": [
                                            model: "ultimateglass:block/${centeredBlockName}"
                                    ]
                            ]
                    ]
            )

            for (int mask = 0; mask < 16; mask++) {
                writeJson(
                        "assets/ultimateglass/models/block/${blockName}_shape_${mask}.json",
                        [
                                parent: "ultimateglass:block/edge_pane_shape_${mask}_base",
                                textures: textures
                        ]
                )
            }

            def multipart = []
            orientations.each { orientation ->
                for (int mask = 0; mask < 16; mask++) {
                    def condition = [facing: orientation.facing]
                    connectionSides.eachWithIndex { side, index ->
                        condition["connect_${side}"] = ((mask & (1 << index)) != 0).toString()
                    }

                    multipart << [
                            when: condition,
                            apply: [
                                    model: "ultimateglass:block/${blockName}_shape_${mask}"
                            ] + orientation.rotation
                    ]
                }
            }

            writeJson(
                    "assets/ultimateglass/blockstates/${blockName}.json",
                    [multipart: multipart]
            )
        }
    }
}

processResources {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
    dependsOn tasks.named("generatePaneResources")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
