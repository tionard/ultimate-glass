name: Publish Version Release

on:
  push:
    branches:
      - main
    paths:
      - gradle.properties
      - build.gradle
      - settings.gradle
      - src/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-version-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main without marketplace actions
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Read version and inspect existing release
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ -z "$VERSION" ]; then
            echo 'Could not read mod_version from gradle.properties.' >&2
            exit 1
          fi

          TAG="v${VERSION}"
          ASSET="ultimate-glass-${VERSION}.jar"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$ASSET"; then
              echo "complete=true" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} already contains ${ASSET}; nothing to publish."
            else
              echo "complete=false" >> "$GITHUB_OUTPUT"
              echo "Release ${TAG} exists but its playable JAR is missing; rebuilding it."
            fi
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Java 25
        if: steps.version.outputs.complete != 'true'
        shell: bash
        run: |
          JAVA_CACHE_ROOT=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          JAVA_HOME=""

          if [ -d "$JAVA_CACHE_ROOT" ]; then
            JAVA_HOME="$(find "$JAVA_CACHE_ROOT" \
              -mindepth 2 -maxdepth 2 -type d -path '*/25*/x64' \
              2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$JAVA_HOME" ] || [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo 'Java 25 is not preinstalled; downloading Temurin 25.'
            rm -rf /tmp/jdk25 /tmp/jdk25.tar.gz
            mkdir -p /tmp/jdk25
            curl --fail --location --retry 4 --retry-all-errors \
              'https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse' \
              --output /tmp/jdk25.tar.gz
            tar -xzf /tmp/jdk25.tar.gz --strip-components=1 -C /tmp/jdk25
            JAVA_HOME=/tmp/jdk25
          fi

          test -x "$JAVA_HOME/bin/java"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version

      - name: Prepare Gradle 9.5.1
        if: steps.version.outputs.complete != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 4 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-9.5.1-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Build mod
        if: steps.version.outputs.complete != 'true'
        run: /tmp/gradle-9.5.1/bin/gradle build --stacktrace

      - name: Smoke-test dedicated server startup
        if: steps.version.outputs.complete != 'true'
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout 120s /tmp/gradle-9.5.1/bin/gradle runServer --args nogui > server-smoke.log 2>&1
          status=$?
          set -e

          cat server-smoke.log

          if ! grep -q 'Done (' server-smoke.log; then
            echo 'Dedicated server did not reach the ready state.' >&2
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Dedicated server exited unexpectedly with status $status." >&2
            exit "$status"
          fi

      - name: Find playable mod JAR
        if: steps.version.outputs.complete != 'true'
        id: mod_jar
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MOD_JAR="build/libs/ultimate-glass-${RELEASE_VERSION}.jar"

          if [ ! -f "$MOD_JAR" ]; then
            MOD_JAR=$(find build/libs -maxdepth 1 -type f \
              -name 'ultimate-glass-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-dev.jar' \
              -print -quit)
          fi

          if [ -z "$MOD_JAR" ] || [ ! -f "$MOD_JAR" ]; then
            echo 'Could not find the playable Ultimate Glass JAR.' >&2
            exit 1
          fi

          echo "path=$MOD_JAR" >> "$GITHUB_OUTPUT"
          sha256sum "$MOD_JAR"

      - name: Ensure version tag exists
        if: steps.version.outputs.complete != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Ultimate Glass $RELEASE_VERSION"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish or repair GitHub Release
        if: steps.version.outputs.complete != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          MOD_JAR: ${{ steps.mod_jar.outputs.path }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$MOD_JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$MOD_JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ultimate Glass $RELEASE_VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: Verify release asset and publish status
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "$RELEASE_ASSET"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='success' \
            -f context="release/${RELEASE_TAG}" \
            -f description="Published ${RELEASE_ASSET}"

      - name: Record verified release in main
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ASSET: ${{ steps.version.outputs.asset }}
        run: |
          VERIFY_FILE=".github/release-verification/${RELEASE_TAG}.txt"
          mkdir -p "$(dirname "$VERIFY_FILE")"
          {
            echo "tag=${RELEASE_TAG}"
            echo "asset=${RELEASE_ASSET}"
            echo "verified_commit=${GITHUB_SHA}"
          } > "$VERIFY_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERIFY_FILE"

          if git diff --cached --quiet; then
            echo 'Release verification file is already current.'
          else
            git commit -m "Record verified ${RELEASE_TAG} release"
            git push origin HEAD:main
          fi