name: Build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Smoke-test dedicated server startup
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout 120s gradle runServer --args nogui > server-smoke.log 2>&1
          status=$?
          set -e

          cat server-smoke.log

          if ! grep -q 'Done (' server-smoke.log; then
            echo 'Dedicated server did not reach the ready state.' >&2
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Dedicated server exited unexpectedly with status $status." >&2
            exit "$status"
          fi

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-glass
          path: build/libs/*.jar
